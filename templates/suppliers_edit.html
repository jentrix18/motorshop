{% extends "base.html" %}
{% block title %}Edit Supplier{% endblock %}
{% block content %}
<div class="topbar"><div><h2>Edit Supplier</h2></div></div>

<div class="card" style="max-width:520px;">
  <form method="post">
    <label>Supplier Name</label>
    <input type="text" name="name" value="{{ supplier.name }}" required>

    <div class="form-row">
      <div>
        <label>Contact Person</label>
        <input type="text" name="contact_person" value="{{ supplier.contact_person or '' }}">
      </div>
      <div>
        <label>Phone</label>
        <input type="text" name="phone" value="{{ supplier.phone or '' }}">
      </div>
    </div>

    <label>Email</label>
    <input type="email" name="email" value="{{ supplier.email or '' }}">

    <label>Address</label>
    <input type="text" name="address" value="{{ supplier.address or '' }}">

    <label>Notes</label>
    <textarea name="notes" rows="3">{{ supplier.notes or '' }}</textarea>

    <div class="checkline">
      <input type="checkbox" name="is_active" id="active" {{ 'checked' if supplier.is_active }}>
      <label for="active">Supplier is active (uncheck to hide from new purchase orders)</label>
    </div>

    <button class="btn btn-primary" type="submit">Save Changes</button>
    <a class="btn" href="{{ url_for('suppliers_list') }}">Cancel</a>
  </form>
</div>
{% endblock %}
